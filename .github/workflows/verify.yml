name: mednik verification

# Runs the offline test suite, then the live end-to-end verification against openFDA, DailyMed,
# ClinicalTrials.gov, PubMed and Europe PMC. The report is shown on the run page (job summary),
# attached as an artifact, and published to the `verification` branch.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/verify.yml"]
  workflow_dispatch:
    inputs:
      indication:
        description: Indication to verify
        default: Schizophrenia
      no_cobenfy:
        description: Compare only Caplyta and Vraylar
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest -q

      - name: Restore live-API cache
        uses: actions/cache@v4
        with:
          path: backend/mednik_cache.db
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Live end-to-end verification
        id: live
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          MEDNIK_LLM_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'none' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          MEDNIK_CONTACT_EMAIL: mednik-ci@users.noreply.github.com
        run: |
          args=(--indication "${{ inputs.indication || 'Schizophrenia' }}")
          if [ "${{ inputs.no_cobenfy }}" = "true" ]; then args+=(--no-cobenfy); fi
          python scripts/verify_e2e.py "${args[@]}" 2>&1 | tee verify.log

      - name: Report on the run page
        if: always()
        run: |
          if [ -f verification_report.md ]; then cat verification_report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report produced — see the log." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            backend/verification_report.md
            backend/verification_report.json
            backend/verification_dossier.md
            backend/verify.log
          if-no-files-found: warn

      - name: Publish to the verification branch
        if: always()
        run: |
          out=$(mktemp -d)
          cp verification_report.md verification_report.json verification_dossier.md verify.log "$out"/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > "$out/SOURCE_COMMIT"
          cd "$out"
          git init -q -b verification
          git config user.name "mednik-ci"
          git config user.email "mednik-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Verification report for ${GITHUB_SHA::7} (${{ steps.live.outcome }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" verification

      - name: Fail the run if verification failed
        if: steps.live.outcome == 'failure'
        run: exit 1
